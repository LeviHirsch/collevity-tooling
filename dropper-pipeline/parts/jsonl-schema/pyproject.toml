[project]
name = "collevity-lake"
version = "0.1.0"
description = "Collevity Data Lake — logical entry schema + thin storage seam over an append-dominant JSONL pool (Phase 1: schema + storage seam, Excel-blind)."
requires-python = ">=3.11"
# UUIDv7 is not in the stdlib `uuid` module (slated for 3.14); `uuid6` is pure
# Python, returns a stdlib `uuid.UUID`, and drops natively into a future
# Postgres `uuid` column (DEC-010, AC1.2). Chosen over uuid-utils (binary wheel,
# speed irrelevant at single-user scale) — see DEC-021.
dependencies = [
    "uuid6>=2024.1.12",
]

[project.scripts]
# The seam's read consumer (DEC-019: sync-then-read). /checkin calls this instead
# of carrying its own shim. Location-agnostic — caller sets COLLEVITY_LAKE.
collevity-read-day = "collevity.lake.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]
# The Excel bridge (Phase 2, AC4) is throwaway transition scaffolding — keep the
# core dep-light by making its xlsx reader an OPTIONAL extra (AC4.5). The core
# never imports openpyxl; the bridge imports it lazily.
excel = ["openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collevity"]
